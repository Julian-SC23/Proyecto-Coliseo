<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro COLISEO CENTENARIO</title>
    <link rel="stylesheet" href="../Estilos/estilos.css">
</head>
<body>
    <!-- =============== MENÚ============================ -->
    <header class="encabezado">
        <div class="contenedor barra">
            <a href="index.html" class="logo">COLISEO<span>CENTENARIO</span></a>

            <nav class="menu">
                <a href="#">Iniciar sesión</a>
            </nav>
        </div>
    </header>

    <main class="contenedor pagina-centrada">
        
        <form class="formulario" action="#" method="post">
            <h1 class="formulario-titulo">Crear cuenta</h1>
            <p class="formulario-subtitulo">Regístrate para comprar y guardar tus boletos.</p>

            <!-- Nombre -->
            <div class="campo">
                <label class="campo-etiqueta" for="nombre">Nombre completo</label>
                <input class="campo-entrada" type="text" id="nombre"
                name="nombre"  placeholder="Nombre como en INE"
                autocomplete="name" required
                >
            </div>
            
        <!-- Correo -->
            <div class="campo">
                <label class="campo-etiqueta" for="correo">Correo electrónico</label>
                <input class="campo-entrada" type="email" id="correo" name="correo"
                placeholder="tucorreo@ejemplo.com" autocomplete="email" required
                >
            </div>

        <!-- Teléfono -->
            <div class="campo">
                <label class="campo-etiqueta" for="telefono">
                Teléfono <span class="campo-opcional">(opcional)</span>
                </label>
                <input class="campo-entrada" type="tel" id="telefono"
            name="telefono" placeholder="87 00 00 00 00"  autocomplete="tel"
                >
            </div>

        <!-- Contraseña -->
            <div class="campo">
                <label class="campo-etiqueta" for="clave">Contraseña</label>
                <input class="campo-entrada" type="password" id="clave"
                name="clave"  placeholder="Mínimo 8 caracteres"
                minlength="8" autocomplete="new-password" required
                >
            </div>
        
        <!-- Confirmar contraseña -->
            <div class="campo">
                <label class="campo-etiqueta" for="clave2">Confirmar contraseña</label>
                <input class="campo-entrada" type="password" id="clave2"
                name="clave2" placeholder="Repite tu contraseña" minlength="8"
                autocomplete="new-password" required
                >
            </div>
        
        <!-- Términos y condiciones -->
            <label class="formulario-terminos">
                <input class="formulario-casilla" type="checkbox" name="terminos" required>
                <span>Acepto los <a href="#" class="formulario-enlace">términos y condiciones</a> y el aviso de privacidad.</span>
            </label>

            <!-- Botón -->
            <button type="submit" class="boton boton-completo">Crear cuenta</button>
        
            <p class="formulario-pie"> ¿Ya tienes cuenta?  
                <a href="Iniciar.html" class="formulario-enlace">Iniciar sesion</a> </p>
        
        </form>
    
    </main>
</body>
</html>
